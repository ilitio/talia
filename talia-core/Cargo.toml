[package]
name = "talia-core"
version = "0.1.1"
edition = "2024"
description = "Shared configuration and control protocol types for Talia"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
toml = "0.9"
utoipa = { version = "5.5.0", features = ["macros"] }

[lints]
workspace = true
